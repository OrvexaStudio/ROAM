<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaxiPilot | Cooperativa Taxi Lecce</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-page">

    <main class="login-container">


        <!-- BRAND -->

        <header class="login-brand">

            <div class="brand-mark">
                CTL
            </div>

            <div class="brand-text">

                <strong>
                    Cooperativa Taxi Lecce
                </strong>

                <span>
                    TaxiPilot
                </span>

            </div>

        </header>


        <!-- =========================
             SCELTA SERVIZIO
        ========================== -->

        <section
            id="serviceStep"
            class="login-step"
        >

            <div class="login-heading">

                <span class="eyebrow">
                    TAXIPILOT
                </span>

                <h1>
                    Iniziamo.
                </h1>

                <p>
                    Seleziona il tipo di servizio che utilizzi.
                </p>

            </div>


            <div class="service-options">

                <button
                    type="button"
                    class="service-option"
                    data-service="taxi"
                >

                    <div class="service-option-text">

                        <span class="service-option-label">
                            TAXI
                        </span>

                        <span class="service-option-description">
                            Gestione delle corse taxi
                        </span>

                    </div>

                    <span class="service-option-arrow">
                        →
                    </span>

                </button>


                <button
                    type="button"
                    class="service-option"
                    data-service="ncc"
                >

                    <div class="service-option-text">

                        <span class="service-option-label">
                            NCC
                        </span>

                        <span class="service-option-description">
                            Gestione dei servizi con conducente
                        </span>

                    </div>

                    <span class="service-option-arrow">
                        →
                    </span>

                </button>

            </div>

        </section>


        <!-- =========================
             DATI CONDUCENTE
        ========================== -->

        <section
            id="driverStep"
            class="login-step is-hidden"
        >

            <button
                type="button"
                id="backButton"
                class="login-back"
            >
                ← Indietro
            </button>


            <div class="login-heading">

                <span
                    id="selectedService"
                    class="eyebrow"
                >
                    TAXI
                </span>

                <h1>
                    I tuoi dati.
                </h1>

                <p>
                    Inserisci il tuo nominativo per continuare.
                </p>

            </div>


            <form
                id="driverForm"
                class="driver-form"
            >

                <div class="input-group">

                    <label for="driverName">
                        NOME E COGNOME
                    </label>

                    <input
                        type="text"
                        id="driverName"
                        name="driverName"
                        placeholder="Es. Cristian"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="driverPhone">
                        TELEFONO
                    </label>

                    <input
                        type="tel"
                        id="driverPhone"
                        name="driverPhone"
                        placeholder="Es. 333 1234567"
                        autocomplete="tel"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="driverCode">
                        NUMERO LICENZA / AUTORIZZAZIONE
                    </label>

                    <input
                        type="text"
                        id="driverCode"
                        name="driverCode"
                        placeholder="Inserisci il numero"
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >

                    <span>
                        Continua
                    </span>

                    <span>
                        →
                    </span>

                </button>


                <p
                    id="loginError"
                    class="login-error"
                    role="alert"
                ></p>

            </form>

        </section>


        <!-- =========================
             PASSWORD
        ========================== -->

        <section
            id="passwordStep"
            class="login-step is-hidden"
        >

            <button
                type="button"
                id="passwordBackButton"
                class="login-back"
            >
                ← Indietro
            </button>


            <div class="login-heading">

                <span
                    id="passwordService"
                    class="eyebrow"
                >
                    TAXI
                </span>

                <h1>
                    Verifica accesso.
                </h1>

                <p>
                    Inserisci la password per accedere a TaxiPilot.
                </p>

            </div>


            <form
                id="passwordForm"
                class="driver-form"
            >

                <div class="input-group">

                    <label for="driverPassword">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="driverPassword"
                        name="password"
                        placeholder="Inserisci la password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >

                    <span>
                        Accedi a TaxiPilot
                    </span>

                    <span>
                        →
                    </span>

                </button>


                <p
                    id="passwordError"
                    class="login-error"
                    role="alert"
                ></p>

            </form>

        </section>


        <!-- FOOTER -->

        <footer class="login-footer">

            <span>
                Cooperativa Taxi Lecce
            </span>

            <span>
                TaxiPilot
            </span>

        </footer>


    </main>


    <script src="js/app.js"></script>

</body>

</html>
